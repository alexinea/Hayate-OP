name: Publish to NuGet

# Publishes every package under src/ to nuget.org.
#
# Trigger : push a tag such as `v2.7`, or run manually (workflow_dispatch).
#           (GitHub runs the workflow snapshot pinned by the pushed tag, so a
#           publishing-channel change only takes effect for tags pushed after
#           the change lands on the default branch.)
#
# Auth    : NuGet trusted publishing (OIDC) is the primary channel, following the
#           dotnetcore/Collections release.yml pattern — the job exchanges a
#           short-lived GitHub OIDC token (`id-token: write`) for a ~1h temporary
#           API key via NuGet/login@v1, so no long-lived secret is stored.
#           Required one-time setup on nuget.org (trusted publishing policy):
#             Repository owner : alexinea
#             Repository       : object-pool
#             Workflow file    : publish-nuget.yml
#             Package owner    : the AlexLEWIS nuget.org profile
#           Repository secret NUGET_USERNAME must hold the nuget.org profile
#           name (not the e-mail) for the OIDC exchange.
#           Fallback: when the OIDC login does not yield a key (policy not yet
#           configured, NUGET_USERNAME missing), the push falls back to the
#           stored NUGET_API_KEY secret; publishing fails only when neither is
#           available. This keeps the channel alive while trusted publishing is
#           being rolled out.
#
# The local `scripts/Release.bat` is kept as an offline fallback; CI is the
# primary publishing channel from 2.6 onward.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.8). Must match asset/version.props.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CONFIGURATION: Release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_OUTPUT: nuget_packages

jobs:
  publish:
    name: Pack and push
    runs-on: windows-latest
    # Job-level permissions replace the workflow-level block, so contents: read
    # is restated here. id-token: write lets GitHub mint the OIDC token that
    # NuGet trusted publishing exchanges for a short-lived API key.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SourceLink needs full history for the deterministic build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          props_major=$(grep -oP '(?<=<VersionMajor>)[^<]+' asset/version.props)
          props_minor=$(grep -oP '(?<=<VersionMinor>)[^<]+' asset/version.props)
          props_patch=$(grep -oP '(?<=<VersionPatch>)[^<]+' asset/version.props)
          props_full="${props_major}.${props_minor}.${props_patch}"
          props_short="${props_major}.${props_minor}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested="${{ github.event.inputs.version }}"
          else
            requested="${GITHUB_REF_NAME#v}"
          fi

          echo "asset/version.props = ${props_full}"
          echo "requested           = ${requested}"

          # Tag convention in this repository is two-part (v2.1, v2.2, ...); accept both
          # `2.8` and `2.8.0`, and require the patch component to match when supplied.
          case "${requested}" in
            "${props_full}") ;;
            "${props_short}") ;;
            *)
              echo "::error::Requested version '${requested}' does not match asset/version.props '${props_full}'."
              exit 1
              ;;
          esac

          echo "value=${props_full}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore HayateOP.slnx --source ${{ env.NUGET_SOURCE }}

      - name: Build (Release)
        run: dotnet build HayateOP.slnx -c ${{ env.CONFIGURATION }} --no-restore

      - name: Run main test suite (gate)
        shell: bash
        run: ./tests/HayateOP.Tests/bin/Release/net10.0/HayateOP.Tests.exe

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ env.PACKAGE_OUTPUT }}"
          for proj in src/*/*.csproj; do
            echo "::group::pack ${proj}"
            dotnet pack "${proj}" -c ${{ env.CONFIGURATION }} -o "${{ env.PACKAGE_OUTPUT }}" --no-restore
            echo "::endgroup::"
          done
          echo "Produced:"
          ls -1 "${{ env.PACKAGE_OUTPUT }}"

      # Must run right before the push: the temporary key lives for ~1 hour, and each
      # OIDC token can only be exchanged for a single key. continue-on-error keeps the
      # stored-key fallback usable while the nuget.org trusted-publishing policy is not
      # yet in place; a failed exchange simply leaves the output empty.
      - name: NuGet login (OIDC -> temporary API key)
        id: nuget_login
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          # nuget.org profile name, not the e-mail address.
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push to nuget.org
        shell: bash
        env:
          OIDC_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          api_key="${OIDC_API_KEY:-}"
          auth_source="NuGet trusted publishing (OIDC)"
          if [ -z "${api_key}" ]; then
            api_key="${NUGET_API_KEY:-}"
            auth_source="stored NUGET_API_KEY (trusted-publishing fallback)"
          fi
          if [ -z "${api_key}" ]; then
            echo "::error::No publish credential: the OIDC login produced no key (configure the nuget.org trusted-publishing policy + NUGET_USERNAME) and NUGET_API_KEY is not configured."
            exit 1
          fi
          echo "Auth via ${auth_source}"

          find "${{ env.PACKAGE_OUTPUT }}" -name '*.nupkg' -o -name '*.snupkg' | while read -r pkg; do
            echo "::group::push ${pkg}"
            dotnet nuget push "${pkg}" \
              --source "${{ env.NUGET_SOURCE }}" \
              --api-key "${api_key}" \
              --skip-duplicate
            echo "::endgroup::"
          done

      - name: Upload packages as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.value }}
          path: ${{ env.PACKAGE_OUTPUT }}/*.*nupkg
          if-no-files-found: warn
          retention-days: 30
